# Deployment pipeline — runs ONLY after the CI workflow ("CI") succeeds on main.
# Keeps deploy concerns out of ci.yml (CI gates correctness; this gates release).
#
# ONE leg:
#   - migrate : DB migrations against Supabase Toronto     (needs DATABASE_DIRECT_URL)
#
# VERCEL IS NOT DEPLOYED HERE. Both `site` (marketing) and `hale-web` (the app)
# are GitHub-connected Vercel projects that auto-deploy on main pushes via the
# native Vercel integration — verified 2026-07-05: vercel[bot] creates the
# Production deployment on every main merge. The old CLI-based `vercel` leg here
# was a redundant SECOND prod deploy that failed on a stale VERCEL_TOKEN, so
# every Deploy run went red for a step that did nothing; removed 2026-07-05.
# (Manual redeploy if ever needed: `vercel deploy --prod` with a valid token.)
# Scheduled work is Vercel Cron on hale-web (`/api/cron/*`), not a worker deploy.
#
# GATING CONTRACT (see preflight job):
#   - DATABASE_DIRECT_URL absent FAILS the workflow. A green deploy that skipped
#     migrations is how production served code against a stale schema (VIL-330).
#     The secret name is DATABASE_DIRECT_URL (Supabase direct, port 5432).
#   - A leg that DOES run but finds its required secret empty FAILS LOUD.
#
# WEB (Vercel) does not wait for this workflow. hale-web's production build
# applies migrations itself, before the deployment is aliased — see
# packages/db/scripts/vercel-production-migrate.mjs. This leg still runs so a
# cancelled CI (which skips this workflow) is not the only apply path.
#
# ROLLBACK (manual — see docs/deploy/README.md for full procedure):
#   - Vercel : `vercel promote <previous-prod-url> --token=$VERCEL_TOKEN`
#              (app and `/api/cron/*` handlers roll back together)
#   - DB     : migrations are additive (CLAUDE.md #9) — no auto down-migration;
#              restore from Supabase PITR if a migration is bad.

name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gate the whole pipeline on CI success. Secrets can't be read in job-level
  # `if:`, so presence is asserted here. An absent DATABASE_DIRECT_URL fails
  # the workflow instead of skipping the migrate leg.
  preflight:
    name: Preflight (CI gate + secret presence)
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      has_db: ${{ steps.check.outputs.has_db }}
    steps:
      - id: check
        env:
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
        run: |
          set -euo pipefail
          if [ -z "$DATABASE_DIRECT_URL" ]; then
            echo "::error::DATABASE_DIRECT_URL is not set. Refusing to deploy: production would ship code whose Drizzle migrations were never applied. Add the Supabase direct (port 5432, non-pooled) connection string as the Actions secret DATABASE_DIRECT_URL. The hale-web Vercel project needs the same name on the Production environment so the production build can migrate before the deployment is aliased."
            exit 1
          fi
          echo "has_db=true" >> "$GITHUB_OUTPUT"

  # ── DB migrations → Supabase Toronto ──────────────────────────────────────
  migrate:
    name: DB migrate (Supabase yyz)
    needs: preflight
    if: needs.preflight.outputs.has_db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations and fail if any journal hash is still missing
        env:
          # DIRECT (non-pooled) URL — DDL runs in a transaction, which PgBouncer
          # transaction-pooling can't hold. migrate:guard takes the advisory lock,
          # runs drizzle migrate, then the hash check.
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_DIRECT_URL:-}" ]; then
            echo "::error::migrate leg ran without DATABASE_DIRECT_URL — refusing to proceed."; exit 1
          fi
          pnpm --filter @hale/db migrate:guard
      - name: Verify no unapplied migrations
        # Second, read-only pass of `pnpm db:check-migrations`. Exits non-zero
        # when a journal file's sha256 is not in drizzle.__drizzle_migrations.
        # A watermark-only "in sync" is not enough: drizzle will not apply a
        # file whose `when` is already <= max(created_at).
        env:
          DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
        run: pnpm db:check-migrations
