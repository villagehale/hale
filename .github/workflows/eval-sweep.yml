name: Eval sweep

# CI names each eval gate by hand, so a suite that ships without being added to
# ci.yml is a gate nobody runs (VIL-290). This job discovers the runners instead
# of listing them: every apps/worker/evals/run-*.mjs, replayed from the committed
# cache.
#
# Cached-only means zero API calls (a cache miss FAILS LOUDLY instead of spending),
# so this job needs no secrets. Do not add any — an eval that can reach the API is
# an eval that can quietly bill on a schedule. Does not set HALE_EVERY_EVAL_KNOWN_OK,
# so suites that CI currently allows on main still fail here.

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  sweep:
    name: All eval suites (cached-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build leaf packages
        run: pnpm --filter @hale/db --filter @hale/types --filter @hale/tools-contracts --filter @hale/agent --filter @hale/worker build

      - name: Run every eval suite (cached-only)
        run: scripts/ci/run-every-eval.sh
