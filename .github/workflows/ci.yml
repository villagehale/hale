name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Prompt lockfile check
        run: pnpm --filter @hale/worker prompts:check

      - name: Skill lockfile check
        run: pnpm --filter @hale/agent skills:check

      - name: Classifier eval (cached-only)
        run: pnpm --filter @hale/worker eval:classifier

      - name: Drafter eval (cached-only)
        run: pnpm --filter @hale/worker eval:drafter

      - name: Memory inferencer eval (cached-only)
        run: pnpm --filter @hale/worker eval:memory

      - name: Memory writeback eval (cached-only)
        run: pnpm --filter @hale/worker eval:memory-writeback

      - name: Reviewer eval (cached-only)
        run: pnpm --filter @hale/worker eval:reviewer

      - name: Week-summary eval (cached-only)
        run: pnpm --filter @hale/worker eval:week-summary

      - name: Agent suites eval (ask-hale/discovery, cached-only)
        run: pnpm --filter @hale/worker eval:agents

      - name: Village search intent eval (cached-only)
        run: pnpm --filter @hale/worker eval:village-search

      - name: Sentinel triage/extraction eval (cached-only)
        run: pnpm --filter @hale/worker eval:sentinel

      - name: SMS intake extraction/intent eval (cached-only)
        run: pnpm --filter @hale/worker eval:intake

      - name: Intake voice composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:intake-voice

      - name: Mid-signup answer composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:intake-answer

      - name: Off-domain capability lane eval (cached-only)
        run: pnpm --filter @hale/worker eval:inbound-lane

      - name: General-answer composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:general-answer

      - name: Medical-symptom answer eval (cached-only)
        run: pnpm --filter @hale/worker eval:medical-symptom

      - name: Turn-apology composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:turn-apology

      - name: Follow-up ask composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:followup-voice

      - name: Calendar invite + email-ask composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:calendar-voice

      - name: Identity ask composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:identity-ask

      - name: Reminder voice composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:reminder-voice

      - name: Introduction ask composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:intro-voice

      - name: Natural reply resolver eval (cached-only)
        run: pnpm --filter @hale/worker eval:reply-resolver

      - name: Radar payload composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:radar

      - name: Proactive nudge composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:nudge

      - name: Birthday-party extraction eval (cached-only)
        run: pnpm --filter @hale/worker eval:rsvp

      - name: Channel coach eval (cached-only)
        run: pnpm --filter @hale/worker eval:coach-channel

      - name: Voice turn eval (cached-only)
        run: pnpm --filter @hale/worker eval:voice-turn

      - name: Coaching plan composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:coach-plan

      - name: Civic hours parser eval (cached-only)
        run: pnpm --filter @hale/worker eval:civic-hours

      - name: Registration re-verify eval (cached-only)
        run: pnpm --filter @hale/worker eval:registration-verify

      # The activity lane's two legs. Neither was wired here when they shipped, so the
      # scripts existed and nothing ran them - which is a gate in name only.
      - name: Activity finder eval (cached-only)
        run: pnpm --filter @hale/worker eval:activity-finder

      - name: Activity deep-pass eval (cached-only)
        run: pnpm --filter @hale/worker eval:activity-deep

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub
          DATABASE_DIRECT_URL: postgresql://stub:stub@localhost:5432/stub
