name: CI

# Worker evals stay in this workflow, behind a path filter, rather than on a
# workflow-level `paths:` list. A paths filter that skips the workflow would
# also skip lint/typecheck/test/build and would leave the required check
# pending. The check name below is unchanged on purpose.
#
# Required check: "Lint, typecheck, test, build"
#   Reports on every PR (push, pull_request, workflow_dispatch). Passes when
#   workspace lint, typecheck, test, and build passed, and worker evals either
#   passed or were skipped because the diff was site-only. Branch protection
#   should require this name. It already fails closed when evals were supposed
#   to run and did not pass.
#
# Not a required check: "Worker evals (cached-only)"
#   Skipped when the diff is site-only. Requiring this job name leaves those
#   PRs stuck, because a skipped required check does not count as success.
#
# Site-only (evals skipped): every file is under apps/site/, or the only other
# file is pnpm-lock.yaml and that hunk is confined to the apps/site importer
# plus package entries no other importer selects. @hale/types is shared, so
# packages/types still runs evals. apps/web, apps/worker, packages/agent,
# packages/db, and packages/tools-contracts run evals. Any other path does too.

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]
  # Lets ci-heal.yml dispatch a fresh run after pushing a heal commit —
  # GITHUB_TOKEN pushes never retrigger pull_request workflows on their own.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only for every job: the test shards run the whole third-party dependency
# tree. A job whose step needs more gets its own permissions block, never here.
permissions:
  contents: read

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      worker_evals: ${{ steps.decide.outputs.worker_evals }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true

      - name: Decide whether worker evals apply
        id: decide
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
        run: node scripts/ci/worker-eval-paths.mjs

  verify:
    name: Workspace lint, typecheck, test, build
    runs-on: ubuntu-latest
    # The workspace test suite runs in the `test` job's shards; this job keeps
    # lint, typecheck, the repo-script tests, the lockfile checks and the build.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Repo scripts test (ci-heal classifier)
        run: pnpm test:scripts

      - name: Prompt lockfile check
        run: pnpm --filter @hale/worker prompts:check

      - name: Skill lockfile check
        run: pnpm --filter @hale/agent skills:check

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          DATABASE_URL: postgresql://stub:stub@localhost:5432/stub
          DATABASE_DIRECT_URL: postgresql://stub:stub@localhost:5432/stub

  test:
    name: Workspace tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    # The suite used to run serially inside `verify` (12.9 minutes of a
    # 16-minute job on 2026-11-04). Web runs in four vitest shards beside one
    # job for every other package; the `required` gate needs all of them.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web 1/4
            web_shard: 1/4
          - name: web 2/4
            web_shard: 2/4
          - name: web 3/4
            web_shard: 3/4
          - name: web 4/4
            web_shard: 4/4
          - name: other packages
            web_shard: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        if: ${{ matrix.web_shard != '' }}
        run: pnpm exec turbo run build --filter='./packages/*'

      # The signup sandbox drives local mock forms through Playwright. The
      # package is already a web devDependency; the browser binary is not.
      - name: Cache Playwright browsers
        if: ${{ matrix.web_shard != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-

      - name: Install Playwright chromium
        if: ${{ matrix.web_shard != '' }}
        run: |
          # Browser binaries come from the cache (or a download). --with-deps
          # goes through apt; hosted-runner mirrors flake with exit 100.
          pnpm --filter @hale/web exec playwright install chromium
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt || true
          pnpm --filter @hale/web exec playwright install --with-deps chromium || echo 'playwright --with-deps skipped (apt flake)'

      # Named 'Test' on purpose: scripts/ci/classify.mjs reruns a pglite timeout flake only from a step named Test.
      - name: Test
        if: ${{ matrix.web_shard != '' }}
        run: pnpm --filter @hale/web exec vitest run --shard=${{ matrix.web_shard }}

      - name: Test
        if: ${{ matrix.web_shard == '' }}
        run: pnpm exec turbo run test --filter='!@hale/web'

  worker-evals:
    name: Worker evals (cached-only)
    needs: changes
    if: ${{ needs.changes.result == 'success' && needs.changes.outputs.worker_evals == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The single verify job used to build these as turbo deps of typecheck/test
      # before the eval steps. This job does not run those tasks, and @hale/db,
      # @hale/types, @hale/agent, and @hale/tools-contracts export dist/. Without
      # this, eval:memory-writeback dies on apps/web/lib/testing/pglite.ts importing
      # @hale/db/dist/index.js. Same package set as eval-sweep.yml.
      - name: Build workspace packages
        run: pnpm --filter @hale/db --filter @hale/types --filter @hale/flags --filter @hale/tools-contracts --filter @hale/agent --filter @hale/worker build

      - name: Classifier eval (cached-only)
        run: pnpm --filter @hale/worker eval:classifier

      - name: Drafter eval (cached-only)
        run: pnpm --filter @hale/worker eval:drafter

      - name: Memory inferencer eval (cached-only)
        run: pnpm --filter @hale/worker eval:memory

      - name: Memory writeback eval (cached-only)
        run: pnpm --filter @hale/worker eval:memory-writeback

      - name: Reviewer eval (cached-only)
        run: pnpm --filter @hale/worker eval:reviewer

      - name: Agent suites eval (discovery, cached-only)
        run: pnpm --filter @hale/worker eval:agents

      - name: Village search intent eval (cached-only)
        run: pnpm --filter @hale/worker eval:village-search

      - name: Sentinel triage/extraction eval (cached-only)
        run: pnpm --filter @hale/worker eval:sentinel

      - name: SMS intake extraction/intent eval (cached-only)
        run: pnpm --filter @hale/worker eval:intake

      - name: Mid-signup answer composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:intake-answer

      - name: Mid-signup grounding searches eval (cached-only)
        run: pnpm --filter @hale/worker eval:intake-ground

      - name: Off-domain capability lane eval (cached-only)
        run: pnpm --filter @hale/worker eval:inbound-lane

      - name: General-answer composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:general-answer

      - name: Medical-symptom answer eval (cached-only)
        run: pnpm --filter @hale/worker eval:medical-symptom

      - name: Turn-apology composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:turn-apology

      - name: Holding line composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:holding-line

      - name: Inbound burst reader eval (cached-only)
        run: pnpm --filter @hale/worker eval:inbound-burst

      - name: Inbound side-turn reader eval (cached-only)
        run: pnpm --filter @hale/worker eval:inbound-side-turn

      # VIL-540 meaning gate: a promised time or an app/website, in any language.
      # Replays the recorded verdicts; a miss fails the job.
      - name: Holding-line judge (cached-only)
        run: pnpm --filter @hale/worker eval:holding-line-judge

      # Request shape and price. $0, no model. Hard gate.
      - name: Holding-line judge (dry)
        run: pnpm --filter @hale/worker eval:holding-line-judge:dry

      - name: Follow-up ask composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:followup-voice


      - name: Identity ask composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:identity-ask

      - name: Add-them-yourself reply composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:add-them-yourself

      # VIL-438/439/440 group suites.
      - name: Group welcome composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:group-welcome-voice

      # The 2000 coach budget and no-tools re-ask move every agent key. REVERT this
      # continue-on-error in the paid re-record, before merge. (VIL-536)
      - name: Group privacy coach eval (cached-only)
        continue-on-error: true
        run: pnpm --filter @hale/worker eval:group-privacy

      - name: Read-email coach eval (cached-only)
        run: pnpm --filter @hale/worker eval:read-email

      - name: Read-email coach eval broken calibration (cached-only)
        run: pnpm --filter @hale/worker eval:read-email:broken

      - name: Group turn read classifier eval (cached-only)
        run: pnpm --filter @hale/worker eval:group-turn-read

      # VIL-459 find a common time across families.
      - name: Common time composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:common-time

      # VIL-456 shared-group reading, with the VIL-459 find-time ask.
      - name: Shared-group reading classifier eval (cached-only)
        run: pnpm --filter @hale/worker eval:shared-group-reading

      - name: Group mention read classifier eval (cached-only)
        run: pnpm --filter @hale/worker eval:group-mention-read

      - name: Introduction ask composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:intro-voice

      - name: Natural reply resolver eval (cached-only)
        run: pnpm --filter @hale/worker eval:reply-resolver

      - name: Radar payload composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:radar

      - name: Proactive nudge composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:nudge

      - name: Birthday-party extraction eval (cached-only)
        run: pnpm --filter @hale/worker eval:rsvp

      # The 2000 coach budget, no-tools re-ask, and the new grouped-map fixture move
      # every agent key. REVERT these continue-on-error flags in the paid re-record,
      # before merge. (VIL-536)
      - name: Channel coach eval (cached-only)
        continue-on-error: true
        run: pnpm --filter @hale/worker eval:coach-channel

      - name: Group shared lists eval (cached-only)
        continue-on-error: true
        run: pnpm --filter @hale/worker eval:group-lists

      - name: Coach local day eval (cached-only)
        continue-on-error: true
        run: pnpm --filter @hale/worker eval:coach-local-day

      - name: Coach capability correction eval (cached-only)
        continue-on-error: true
        run: pnpm --filter @hale/worker eval:coach-capability-correction
      - name: Coach voice-memo choice eval (cached-only)
        continue-on-error: true
        run: pnpm --filter @hale/worker eval:coach-voice-memo

      # One coach answer as several iMessage bubbles. Recorded; a miss fails CI.
      - name: Coach bubbles eval (cached-only)
        run: pnpm --filter @hale/worker eval:coach-bubbles

      - name: Proactive decider eval (cached-only)
        run: pnpm --filter @hale/worker eval:proactive-decider

      - name: Proactive writer eval (cached-only)
        run: pnpm --filter @hale/worker eval:proactive-writer

      - name: Workstream extract eval (cached-only)
        run: pnpm --filter @hale/worker eval:workstream-extract

      - name: Calendar-invite time judge eval (cached-only)
        run: pnpm --filter @hale/worker exec node evals/run-calendar-invite-time-eval.mjs --cached-only

      - name: Calendar-invite writer eval (cached-only)
        run: pnpm --filter @hale/worker eval:calendar-invite-voice

      - name: Calendar-invite writer eval (broken calibration)
        run: pnpm --filter @hale/worker eval:calendar-invite-voice:broken

      - name: Weekday-care ask eval (cached-only)
        run: pnpm --filter @hale/worker eval:weekday-care-ask

      - name: Coaching plan composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:coach-plan

      - name: Registration re-verify eval (cached-only)
        run: pnpm --filter @hale/worker eval:registration-verify

      - name: Registration date-unconfirmed text eval (cached-only)
        run: pnpm --filter @hale/worker eval:registration-date-unconfirmed

      - name: Registration date-moved text eval (cached-only)
        run: pnpm --filter @hale/worker eval:registration-date-moved

      - name: Spot-opened text eval (cached-only)
        run: pnpm --filter @hale/worker eval:spot-open-voice

      - name: Class availability reader eval (cached-only)
        run: pnpm --filter @hale/worker eval:class-availability

      # The only model call in the review pool. Nothing downstream re-checks a verdict -
      # it IS the row another family is eventually shown - so this is the gate, and it is
      # wired here BEFORE the pass that calls it exists.
      - name: Activity verdict eval (cached-only)
        run: pnpm --filter @hale/worker eval:activity-verdict

      # The activity lane's two legs. Neither was wired here when they shipped, so the
      # scripts existed and nothing ran them - which is a gate in name only.
      - name: Activity finder eval (cached-only)
        run: pnpm --filter @hale/worker eval:activity-finder

      - name: Activity deep-pass eval (cached-only)
        run: pnpm --filter @hale/worker eval:activity-deep

      # The ONLY model call in the travel-brief lane. The city it writes is stored,
      # exported to the family and sent to a search engine, and `child_evidence` IS the
      # rule "Hale never briefs a solo work trip" - so this is the gate, and it is wired
      # here BEFORE the pass that calls it ships.
      - name: Travel-booking extraction eval (cached-only)
        run: pnpm --filter @hale/worker eval:travel-extract

      # The kid-relevance judge decides what Hale may track, remind about or text about
      # from a parent's calendar, mailbox and group. Nothing downstream re-checks a verdict,
      # so this is the gate, wired before any caller ships (VIL-226 / VIL-403).
      - name: Kid-relevance judge eval (cached-only)
        run: pnpm --filter @hale/worker eval:kid-relevance

      # VIL-413. A URL this read returns counts as seen this turn for offer_signup, so an
      # invented completion or a URL a planted line asked for would become an offer.
      - name: Inbound photo facts eval (cached-only)
        run: pnpm --filter @hale/worker eval:inbound-photo-facts

      - name: Autonomy notice eval (cached-only)
        run: pnpm --filter @hale/worker eval:autonomy-notice

      - name: Calendar write notice eval (cached-only)
        run: pnpm --filter @hale/worker eval:calendar-write-notice

      - name: Reminder eval (cached-only)
        run: pnpm --filter @hale/worker eval:reminder

      - name: Said-line composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:said-line

      # VIL-530 meaning gate: the real convey judge, cached-only. A miss fails CI.
      # Do not remove the judge to keep this green.
      - name: Said-line convey judge (cached-only)
        run: pnpm --filter @hale/worker eval:said-line-convey

      # Request shape and price. $0, no model. Hard gate.
      - name: Said-line convey judge (dry)
        run: pnpm --filter @hale/worker eval:said-line-convey:dry
      - name: Linq sticker eval (cached-only)
        run: pnpm --filter @hale/worker eval:linq-sticker

      - name: Linq effect eval (cached-only)
        run: pnpm --filter @hale/worker eval:linq-effect

      # VIL-479: linq-edit decision cache recorded. A miss fails CI.
      - name: Linq edit eval (cached-only)
        run: pnpm --filter @hale/worker eval:linq-edit

      # Request shape and price. $0, no model. Hard gate.
      - name: Linq edit eval (dry)
        run: pnpm --filter @hale/worker eval:linq-edit:dry

      - name: Area read eval (cached-only)
        run: pnpm --filter @hale/worker eval:area-read

      - name: Carpool reader eval (cached-only)
        run: pnpm --filter @hale/worker eval:carpool

      - name: Group reminder eval (cached-only)
        working-directory: apps/worker
        run: node evals/group-reminder-eval.mjs --cached-only

      - name: Group reminder eval, broken arm must fail (cached-only)
        working-directory: apps/worker
        run: node evals/group-reminder-eval.mjs --cached-only --broken

      - name: Email alert notice eval (cached-only)
        run: pnpm --filter @hale/worker eval:email-alert-notice

      # Calibration: the code-built line main used to send must fail every silent fixture,
      # and the judge must catch every unsupported claim (recorded; UNRECORDED fails CI).
      - name: Email alert notice eval (broken calibration)
        run: pnpm --filter @hale/worker eval:email-alert-notice:broken

      # VIL-560: hostile emails, calendar events and registration pages in en/fr/zh/es,
      # through the real alert, pipeline, drafter, notes, memory and registration lanes.
      # Hard gate: zero attacker successes, and every lane reached its outcome.
      - name: Prompt-injection eval (cached-only)
        run: pnpm --filter @hale/worker eval:injection

      - name: Calendar offer read eval (cached-only)
        run: pnpm --filter @hale/worker eval:calendar-offer-read
      # VIL-442 group RSVP reader + voice. A cache miss fails CI.
      - name: Group plan RSVP eval (cached-only)
        run: pnpm --filter @hale/worker eval:group-plan-rsvp
      # VIL-503 reader + voice. Recorded Nov 1; a cache miss fails CI.
      - name: Group plan RSVP calendar eval (cached-only)
        run: pnpm --filter @hale/worker eval:group-plan-rsvp-calendar

      - name: Connector disconnect read eval (cached-only)
        run: pnpm --filter @hale/worker eval:connector-disconnect-read

      # VIL-558: the day-before registration plan read (exact) and its replies (judge).
      - name: Signup plan read eval (cached-only)
        run: pnpm --filter @hale/worker eval:signup-plan-read

      # VIL-682: whether a new sign-up ask replaces one of the parent's earlier asks (exact).
      - name: Signup offer supersede eval (cached-only)
        run: pnpm --filter @hale/worker eval:signup-offer-supersede

      - name: Signup plan reply eval (cached-only)
        run: pnpm --filter @hale/worker eval:signup-plan-reply

      - name: Signup plan reply calibration (cached-only)
        run: pnpm --filter @hale/worker eval:signup-plan-reply:broken

      - name: Rec-morning read eval (cached-only)
        run: pnpm --filter @hale/worker eval:rec-morning-read

      - name: Find reasoning judge eval (cached-only)
        run: pnpm --filter @hale/worker eval:find-reasoning-judge

      - name: Find-turn read eval (cached-only)
        run: pnpm --filter @hale/worker eval:find-turn

      - name: Crisis reply eval (cached-only)
        run: pnpm --filter @hale/worker eval:crisis-reply

      - name: Opt-out read eval (cached-only)
        run: pnpm --filter @hale/worker eval:opt-out-read

      # VIL-581: the claim reader (dark) in en/fr/zh/es/ar. Hard: 100% of false claims
      # caught, >= 95% of true replies passed, per-language recall/precision/backing floors.
      - name: Claim read eval (cached-only)
        run: pnpm --filter @hale/worker eval:claim-read

      # Calibration, $0: no claims, every claim backed, a random row, the wrong kind and
      # silence on injection rows must each fail its bar, and the gold labels must pass.
      - name: Claim read eval (broken calibration)
        run: pnpm --filter @hale/worker eval:claim-read:broken

      - name: Weekday-care reply eval (cached-only)
        run: pnpm --filter @hale/worker eval:weekday-care-reply

      - name: Group introduction composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:intro-group-voice

      - name: Calendar cancel composer eval (cached-only)
        run: pnpm --filter @hale/worker eval:calendar-cancel-voice

      - name: Calendar kid notice writer eval (cached-only)
        run: pnpm --filter @hale/worker eval:calendar-kid-notice

      # Hard cache gate. A miss fails the job.
      - name: Name take-back eval (cached-only)
        run: pnpm --filter @hale/worker eval:name-takeback

      # Hard cache gate. A miss fails the job.
      - name: Onboarding reply fields eval (cached-only)
        run: pnpm --filter @hale/worker eval:friend-marks

      # Hard cache gate. A miss fails the job.
      - name: Household group eval (cached-only)
        run: pnpm --filter @hale/worker eval:household-group

      - name: Household group eval (broken calibration)
        run: pnpm --filter @hale/worker eval:household-group:broken

  # Aggregator that preserves the historical check name. Always reports, including
  # when worker evals were skipped, so branch protection is not left waiting on a
  # skipped job. Fails when workspace checks fail or when evals were required and
  # did not pass.
  required:
    name: Lint, typecheck, test, build
    needs: [changes, verify, test, worker-evals]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true

      - name: Require workspace checks and worker evals
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          TEST_RESULT: ${{ needs.test.result }}
          EVALS_RESULT: ${{ needs.worker-evals.result }}
          WORKER_EVALS: ${{ needs.changes.outputs.worker_evals }}
        run: node scripts/ci/required-check.mjs
