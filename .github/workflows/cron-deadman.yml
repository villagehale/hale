# CRON DEAD-MAN SWITCH (audit P1-8).
#
# WHY GITHUB: every watchdog Hale has — the drain, the Twilio triage, the
# delivery sweep, the spend alert, the digests — runs on the same Vercel cron
# substrate it monitors. If Vercel crons stop, the alarm that would say so
# stops with them. This workflow is the one check that lives in a DIFFERENT
# failure domain: GitHub Actions' scheduler, GitHub's runners, GitHub's
# network. It shares nothing with Vercel but the public internet. If GitHub
# and Vercel are down at once nothing here fires — that residual risk is
# accepted and documented here rather than papered over.
#
# Residual risks, named:
#   - GitHub disables scheduled workflows after 60 days without repo activity.
#     This repo commits near-daily; if it ever goes quiet, re-enable by hand.
#   - `schedule:` is best-effort and can lag minutes at busy times. The health
#     endpoint's thresholds already carry 2×period + 15 min of grace, so
#     scheduler lag cannot produce a false page.
#
# WHAT IT DOES: every 10 minutes, probe /api/health/crons (names + ages only —
# the endpoint is deliberately unrevealing) and, if the endpoint is
# unreachable, unparseable, empty, or reports ANY stale entry, post to Slack
# #ops. An unreachable endpoint pages exactly like a stale cron: a refusal is
# not evidence of health. The array carries one entry that is not a cron —
# `lane:inbound-turns`, the age of the oldest unfinished inbound text — and
# this checker needs no special case for it: it filters on the 'stale' token,
# not on a manifest slug. It does not text a founder phone.
#
# SECRETS (Actions repo secrets, same names as the app's own env vars):
#   OPS_SLACK_WEBHOOK_URL — Incoming Webhook bound to #ops (C0C5XMCAQ56)
# Optional repository variable:
#   SLACK_OPS_CHANNEL     — defaults to C0C5XMCAQ56
# If the webhook secret is missing while crons are stale, the page step FAILS
# LOUDLY naming it — it never silently no-ops, and it never falls back to SMS
# (rule #11).

name: Cron dead-man

on:
  schedule:
    # Every ten minutes: the inbound lane reads stale at 600s, so a thirty-minute
    # poll would have been the slowest link in the chain. Actions minutes are free
    # on a public repo, and the checker is claim-free — three probes per stall.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Probe cron liveness from off-Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe /api/health/crons
        id: probe
        continue-on-error: true
        run: node .github/scripts/cron-deadman-check.mjs "https://app.villagehale.com/api/health/crons"

      - name: Page Slack #ops
        if: steps.probe.outcome == 'failure'
        env:
          OPS_SLACK_WEBHOOK_URL: ${{ secrets.OPS_SLACK_WEBHOOK_URL }}
          SLACK_OPS_CHANNEL: ${{ vars.SLACK_OPS_CHANNEL }}
          SUMMARY: ${{ steps.probe.outputs.summary }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${OPS_SLACK_WEBHOOK_URL:-}" ]; then
            echo "::error::cron-deadman ALARM (${SUMMARY:-no summary}) but the ops Slack page cannot send — missing Actions secret OPS_SLACK_WEBHOOK_URL. Add an Incoming Webhook for #ops (C0C5XMCAQ56) under repo Settings > Secrets and variables > Actions."
            exit 1
          fi
          node --input-type=module <<'EOF'
          const url = process.env.OPS_SLACK_WEBHOOK_URL ?? '';
          if (!url.startsWith('https://')) {
            console.error('::error::OPS_SLACK_WEBHOOK_URL must be an https incoming-webhook URL');
            process.exit(1);
          }
          const channel = (process.env.SLACK_OPS_CHANNEL || 'C0C5XMCAQ56').trim();
          const summary = process.env.SUMMARY || 'cron health check failed';
          const runUrl = process.env.RUN_URL || '';
          const text = `Hale DEADMAN: ${summary}. A cron or the inbound lane stopped reporting healthy. ${runUrl}`;
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ text, channel }),
            signal: AbortSignal.timeout(15_000),
          });
          if (!response.ok) {
            console.error(`::error::ops Slack webhook refused with HTTP ${response.status}`);
            process.exit(1);
          }
          EOF

      - name: Fail the run when the probe alarmed
        if: steps.probe.outcome == 'failure'
        run: exit 1
